experiment:
  name: stage_a_amass_yolo_extrinsic_only_refine
  seed: 42
  output_dir: outputs/karate_selfcal/stage_a_amass_yolo_extrinsic_only_refine_run

data:
  manifest_path: outputs/karate_selfcal/amass_yolo_stage_a_full_extrinsic_correction_train/manifest_recovered_split_8_1_1.json
  batch_size: 256
  num_workers: 0

model:
  input_dim: 11
  num_joints: 17
  max_views: 4
  d_model: 96
  num_heads: 8
  view_depth: 3
  joint_depth: 3
  mlp_ratio: 2.0
  dropout: 0.1

training:
  device: cuda
  epochs: 100
  lr: 0.00022
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  selection_metric: loss
  early_stop_patience: 22
  early_stop_min_delta: 0.0001
  pretrained_checkpoint: outputs/karate_selfcal/stage_a_amass_yolo_full_extrinsic_correction_residual_run/checkpoints/best.pt

loss:
  target_space: extrinsic_refine
  camera_delta_weight: 1.0
  camera_translation_delta_weight: 0.20
  camera_rotation_delta_weight: 1.0
  camera_scale_delta_weight: 0.60
