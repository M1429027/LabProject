stage: matching

inputs:
  track_jsons: []
  lifted_jsons: []
  view_ids: []

matching:
  use_appearance: true
  use_pose_similarity: true
  use_temporal_consistency: true
  use_motion_prior: true
  min_keypoint_confidence: 0.1

weights:
  appearance: 0.15
  pose_shape: 0.40
  temporal: 0.00
  motion_prior: 0.20
  visibility: 0.20
  skeleton_consistency: 0.05

association:
  min_track_length: 10

lifting:
  method: heuristic_pseudo3d_v1
  min_keypoint_confidence: 0.1

outputs:
  lifting_output_dir: outputs/karate_selfcal/coarse_lifting
  matching_output_dir: outputs/karate_selfcal/cross_view_matching
