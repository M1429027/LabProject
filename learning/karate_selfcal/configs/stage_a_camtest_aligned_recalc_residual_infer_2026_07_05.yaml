experiment:
  name: stage_a_camtest_aligned_recalc_residual_infer_2026_07_05
  seed: 42
  output_dir: outputs/karate_selfcal/camtest_aligned_stage_a_residual_infer_2026_07_05

data:
  manifest_path: outputs/karate_selfcal/camtest_aligned_stage_a_tokens_recalc_residual_2026_07_05/manifest.json
  train_split: test
  val_split: test
  batch_size: 256
  num_workers: 0

model:
  input_dim: 11
  num_joints: 17
  max_views: 4
  d_model: 64
  num_heads: 8
  view_depth: 2
  joint_depth: 2
  mlp_ratio: 2.0
  dropout: 0.1

training:
  device: cuda

loss:
  target_space: triangulated_residual
  absolute_weight: 1.0
  root_relative_weight: 0.25
  endpoint_weight: 0.35
  limb_extension_weight: 0.25
  high_extension_weight: 1.0
  high_extension_threshold: 0.65
  endpoint_joints: [9, 10, 15, 16]