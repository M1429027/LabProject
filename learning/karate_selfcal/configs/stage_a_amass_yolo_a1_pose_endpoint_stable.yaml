experiment:
  name: stage_a_amass_yolo_a1_pose_endpoint_stable
  seed: 42
  output_dir: outputs/karate_selfcal/stage_a_amass_yolo_a1_pose_endpoint_stable_run

data:
  manifest_path: outputs/karate_selfcal/amass_yolo_stage_a_stable_train/manifest_filtered_min30_split_8_1_1.json
  train_split: train
  val_split: val
  batch_size: 256
  num_workers: 0

model:
  input_dim: 11
  num_joints: 17
  max_views: 4
  d_model: 64
  num_heads: 8
  view_depth: 2
  joint_depth: 2
  mlp_ratio: 2.0
  dropout: 0.1

loss:
  target_space: root_relative
  root_relative_weight: 0.0
  absolute_weight: 1.0
  endpoint_joints: [9, 10, 15, 16]
  endpoint_weight: 0.35
  limb_extension_weight: 0.25
  high_extension_weight: 1.0
  high_extension_threshold: 0.65

training:
  device: cuda
  epochs: 120
  lr: 0.0003
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  selection_metric: loss
  early_stop_patience: 20
  early_stop_min_delta: 0.00025
