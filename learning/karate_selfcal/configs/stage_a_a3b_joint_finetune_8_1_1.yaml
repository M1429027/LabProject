experiment:
  name: stage_a_a3b_joint_finetune_cam02_03_07_16_split_8_1_1
  seed: 42
  output_dir: outputs/karate_selfcal/stage_a_a3b_joint_finetune_cam02_03_07_16_split_8_1_1_run

data:
  manifest_path: outputs/karate_selfcal/stage_a_cam02_03_07_16_ray_split_8_1_1/manifest.json
  train_split: train
  val_split: val
  batch_size: 256
  num_workers: 0

model:
  input_dim: 11
  num_joints: 17
  max_views: 4
  d_model: 64
  num_heads: 8
  view_depth: 2
  joint_depth: 2
  mlp_ratio: 2.0
  dropout: 0.1

loss:
  target_space: joint_finetune
  pose_weight: 1.5
  pelvis_weight: 0.5
  full_3d_weight: 0.10
  endpoint_joints: [9, 10, 15, 16]
  endpoint_weight: 0.35
  limb_extension_weight: 0.25
  high_extension_weight: 1.0
  high_extension_threshold: 0.65

training:
  device: auto
  epochs: 60
  lr: 0.0001
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  selection_metric: loss
  early_stop_patience: 10
  early_stop_min_delta: 0.00015
  head_warmup_epochs: 5
  a3_init_mode: pelvis_backbone_pose_head
  pose_checkpoint: outputs/karate_selfcal/stage_a_cam02_03_07_16_ray_endpoint_split_8_1_1_run/checkpoints/best.pt
  pelvis_checkpoint: outputs/karate_selfcal/stage_a_a2_pelvis_cam02_03_07_16_split_8_1_1_run/checkpoints/best.pt