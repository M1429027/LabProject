experiment:
  name: stage_a_physical3d_gated_extrinsic_refine
  seed: 42
  output_dir: outputs/karate_selfcal/stage_a_physical3d_gated_extrinsic_refine_run_2026_07_16

data:
  manifest_path: outputs/karate_selfcal/amass_longtele6m_diagonal45_hrnet_physical3d_camera_gated_snapshot_2026_07_16/manifest.json
  batch_size: 32
  num_workers: 0
  clip_length: 5
  clip_stride: 3

model:
  input_dim: 11
  num_joints: 17
  max_views: 4
  d_model: 96
  num_heads: 8
  view_depth: 3
  joint_depth: 3
  temporal_depth: 2
  camera_depth: 2
  mlp_ratio: 2.0
  dropout: 0.1
  camera_anchor_index: 0
  fix_camera_anchor: true

training:
  device: cuda
  epochs: 120
  lr: 0.00012
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  selection_metric: loss
  early_stop_patience: 20
  early_stop_min_delta: 0.00003

loss:
  target_space: extrinsic_refine
  camera_delta_weight: 1.0
  camera_translation_delta_weight: 0.25
  camera_rotation_delta_weight: 0.25
  camera_rotation_geodesic_weight: 0.5
  camera_rotation_relative_geodesic_weight: 0.5
  camera_scale_delta_weight: 0.0
  use_rotation_corrected_triangulation: true
  apply_origin_correction: true
  rotation_corrected_geometry_weight: 0.25
  rotation_anchor_index: 0
  camera_noop_gate_weight: 0.25
  camera_correction_gate_weight: 0.25
  camera_gate_origin_threshold: 0.03
  camera_gate_translation_threshold: 0.03
  camera_gate_rotation_threshold_deg: 1.5
  camera_gate_scale_threshold: 0.03
  camera_noop_strength_threshold: 0.15
