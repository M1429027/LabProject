stage: selfcal

selfcal:
  window_seconds: 5
  min_matched_frames: 20
  min_joint_confidence: 0.5
  min_shared_joints: 6

relative_pose:
  method: essential_matrix
  robust_estimator: ransac
  min_confidence: 0.3
  frame_step: 2
  max_points_per_pair: 2000
  essential_ransac_threshold: 0.001
  approx_focal_scale: 1.2

bundle_refine:
  enabled: true
  max_iterations: 100
