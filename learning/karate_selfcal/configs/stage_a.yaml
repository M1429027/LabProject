experiment:
  name: stage_a_cam02_03_07_16
  seed: 42
  output_dir: outputs/karate_selfcal/stage_a_cam02_03_07_16_run

data:
  manifest_path: outputs/karate_selfcal/stage_a_cam02_03_07_16/manifest.json
  train_split: train
  val_split: val
  batch_size: 64
  num_workers: 0

model:
  input_dim: 7
  num_joints: 17
  max_views: 4
  d_model: 96
  num_heads: 8
  view_depth: 3
  joint_depth: 3
  mlp_ratio: 2.0
  dropout: 0.1

loss:
  root_relative_weight: 1.0
  absolute_weight: 0.25

training:
  device: auto
  epochs: 10
  lr: 0.0003
  weight_decay: 0.0001
  grad_clip_norm: 1.0
